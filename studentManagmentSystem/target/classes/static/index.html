
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Student Management System</h1>
    <p>Manage your student records</p>
</header>

<main class="container">

    <section class="form-section">
        <h2 id="formTitle">Add New Student</h2>

        <form id="studentForm">

            <input type="hidden" id="studentId">

            <div class="form-grid">
                <div>
                    <label>Student Name</label>
                    <input type="text" id="name"
                           placeholder="Enter name" required>
                </div>

                <div>
                    <label>Age</label>
                    <input type="number" id="age"
                           placeholder="Enter age" min="1" required>
                </div>

                <div>
                    <label>Email</label>
                    <input type="email" id="email"
                           placeholder="Enter email" required>
                </div>

                <div>
                    <label>Roll Number</label>
                    <input type="number" id="rollNo"
                           placeholder="Enter roll number" required>
                </div>

                <div class="full-width">
                    <label>Subject</label>
                    <input type="text" id="subject"
                           placeholder="Enter subject" required>
                </div>
            </div>

            <div class="buttons">
                <button type="submit" id="submitBtn">
                    Add Student
                </button>

                <button type="button" class="cancel-btn"
                        id="cancelBtn" onclick="resetForm()">
                    Cancel
                </button>
            </div>

        </form>
    </section>

    <section class="records-section">

        <div class="records-header">
            <h2>Student Records</h2>
            <button onclick="getAllStudents()">
                Refresh Records
            </button>
        </div>

        <div class="search-box">
            <input type="number" id="searchId"
                   placeholder="Search student by ID">
            <button onclick="getStudentById()">Search</button>
            <button class="all-btn" onclick="getAllStudents()">
                Show All
            </button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Email</th>
                        <th>Roll No</th>
                        <th>Subject</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="studentTable">
                    <tr>
                        <td colspan="7">Loading students...</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </section>

    <p id="message"></p>

</main>

<script src="script.js"></script>
</body>
</html>
